; PlatformIO config for the Elecrow CrowPanel ESP32 E-Paper HMI 2.13" (122x250, B/W)
; Main controller per Elecrow: ESP32-S3.
;
; The board is defined as a generic ESP32-S3 dev kit. Flash size defaults to 4MB,
; which is safe on larger chips; raise it once the module's actual flash size is confirmed.

[env:crowpanel_213]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; If the board enumerates via the ESP32-S3 native USB (not a USB-UART chip),
; these make Serial print over that USB port.
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    zinggjm/GxEPD2
