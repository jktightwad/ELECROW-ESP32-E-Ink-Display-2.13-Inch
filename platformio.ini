; PlatformIO config for the Elecrow CrowPanel ESP32 E-Paper HMI 2.13" (122x250, B/W)
; Main controller per Elecrow: ESP32-S3.
;
; Defined as a generic ESP32-S3 dev kit. Elecrow's README lists 8MB flash and 8MB PSRAM.
; PSRAM is left disabled until it is needed (its type, quad vs octal, is not yet confirmed).

[platformio]
; Build/upload only the main app by default. Pick another environment from the
; PlatformIO environment selector in the status bar to use it instead.
default_envs = crowpanel_213

[env:crowpanel_213]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

; The USB-C port goes through a CH340K USB-to-serial chip wired to UART0 (GPIO43/44),
; per Elecrow's schematic, so Serial must use UART0, not the S3's native USB.
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    zinggjm/GxEPD2

; Exclude the standalone panel test from the main app
build_src_filter = +<*> -<panel_test/>

; Standalone panel diagnostic (no GxEPD2). Select this environment in the
; PlatformIO status bar / sidebar to build and upload it instead of the main app.
[env:panel_test]
extends = env:crowpanel_213
build_src_filter = +<panel_test/>
lib_deps =
